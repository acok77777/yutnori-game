
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7ead5">

  <title>신나는 윷 던지기</title>
  <meta name="description" content="윷을 던져 도개걸윷모를 확인해 보세요!">

  <meta property="og:type" content="website">
  <meta property="og:title" content="신나는 윷 던지기">
  <meta property="og:description" content="윷을 던지고 오늘의 운을 확인해 보세요!">
  <meta property="og:url" content="https://acok77777.github.io/yutnori-game/">
  <meta property="og:site_name" content="신나는 윷 던지기">
  <meta property="og:image" content="https://acok77777.github.io/yutnori-game/yut-preview.png">
  <meta property="og:image:alt" content="신나는 윷 던지기 게임">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="신나는 윷 던지기">
  <meta name="twitter:description" content="윷을 던지고 오늘의 운을 확인해 보세요!">
  <meta name="twitter:image" content="https://acok77777.github.io/yutnori-game/yut-preview.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="sub-title">TRADITIONAL KOREAN GAME</div>
      <h1>🎲 신나는 윷 던지기</h1>
      <p>윷을 던지고 오늘의 운을 확인해 보세요!</p>
    </header>

    <section class="game-card">
      <div class="card-heading">
        <span>🪵 윷 던지는 곳</span>
        <span class="wood-label">나무 윷 4개</span>
      </div>

      <div class="arena" id="arena">
        <div class="floor-shadow"></div>

        <div class="yut-set" id="yutSet">
          <div class="yut-stick face-dots">
            <span class="dots"><i></i><i></i><i></i></span>
          </div>
          <div class="yut-stick face-dots">
            <span class="dots"><i></i><i></i><i></i></span>
          </div>
          <div class="yut-stick face-dots">
            <span class="dots"><i></i><i></i><i></i></span>
          </div>
          <div class="yut-stick face-dots">
            <span class="dots"><i></i><i></i><i></i></span>
          </div>
        </div>

        <div class="floor-line"></div>
        <div class="throw-hint" id="throwHint">윷을 던져 보세요!</div>
      </div>

      <div class="legend">
        <div class="legend-item">
          <span class="legend-stick face-dots">
            <span class="dots"><i></i><i></i><i></i></span>
          </span>
          <span>안 뒤집힘 · 점 3개</span>
        </div>
        <div class="legend-item">
          <span class="legend-stick face-brown"></span>
          <span>뒤집힘 · 갈색</span>
        </div>
      </div>

      <div class="result-panel" id="resultPanel" aria-live="polite">
        <div class="result-emoji" id="resultEmoji">🍀</div>
        <div class="result-name" id="resultName">준비됐나요?</div>
        <div class="result-message" id="resultMessage">
          아래 버튼을 눌러 윷을 던져 보세요.
        </div>
      </div>

      <button class="throw-button" id="throwButton" type="button">
        🎲 윷 던지기
      </button>

      <p class="extra-note" id="extraNote"></p>
    </section>

    <section class="history-card">
      <div class="history-heading">
        <h2>📜 던지기 기록</h2>
        <span id="throwCount">총 0회</span>
      </div>

      <ul class="history-list" id="historyList">
        <li class="empty-history">아직 던진 기록이 없어요.</li>
      </ul>

      <button class="reset-button" id="resetButton" type="button">
        기록 초기화
      </button>
    </section>

    <footer>🍀 즐겁게 윷놀이를 즐겨 보세요!</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
