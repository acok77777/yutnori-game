
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7ead5">

  <title>신나는 윷 던지기</title>
  <meta name="description" content="신나는 윷 던지기 게임!">
  <meta property="og:title" content="신나는 윷 던지기">
  <meta property="og:description" content="윷을 던져 도개걸윷모를 확인해 보세요!">
  <meta property="og:url" content="https://acok77777.github.io/yutnori-game/">
  <meta property="og:image" content="https://acok77777.github.io/yutnori-game/yut-preview.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>🎲 신나는 윷 던지기</h1>
    </header>

    <section class="game-card">
      <div class="card-heading">🪵 윷 던지는 곳</div>

      <div class="arena" id="arena">
        <div class="floor-shadow" id="floorShadow"></div>

        <div class="yut-set">
          <div class="yut-stick">
            <div class="yut-3d">
              <div class="yut-face yut-front">
                <span class="wood-grain"></span>
                <span class="dots"><i></i><i></i><i></i></span>
              </div>
              <div class="yut-face yut-back"></div>
              <div class="yut-edge yut-edge-left"></div>
              <div class="yut-edge yut-edge-right"></div>
              <div class="yut-edge yut-edge-top"></div>
              <div class="yut-edge yut-edge-bottom"></div>
            </div>
          </div>

          <div class="yut-stick">
            <div class="yut-3d">
              <div class="yut-face yut-front">
                <span class="wood-grain"></span>
                <span class="dots"><i></i><i></i><i></i></span>
              </div>
              <div class="yut-face yut-back"></div>
              <div class="yut-edge yut-edge-left"></div>
              <div class="yut-edge yut-edge-right"></div>
              <div class="yut-edge yut-edge-top"></div>
              <div class="yut-edge yut-edge-bottom"></div>
            </div>
          </div>

          <div class="yut-stick">
            <div class="yut-3d">
              <div class="yut-face yut-front">
                <span class="wood-grain"></span>
                <span class="dots"><i></i><i></i><i></i></span>
              </div>
              <div class="yut-face yut-back"></div>
              <div class="yut-edge yut-edge-left"></div>
              <div class="yut-edge yut-edge-right"></div>
              <div class="yut-edge yut-edge-top"></div>
              <div class="yut-edge yut-edge-bottom"></div>
            </div>
          </div>

          <div class="yut-stick">
            <div class="yut-3d">
              <div class="yut-face yut-front">
                <span class="wood-grain"></span>
                <span class="dots"><i></i><i></i><i></i></span>
              </div>
              <div class="yut-face yut-back"></div>
              <div class="yut-edge yut-edge-left"></div>
              <div class="yut-edge yut-edge-right"></div>
              <div class="yut-edge yut-edge-top"></div>
              <div class="yut-edge yut-edge-bottom"></div>
            </div>
          </div>
        </div>

        <div class="floor-line"></div>
      </div>

      <div class="result-panel" aria-live="polite">
        <div class="result-emoji" id="resultEmoji">🍀</div>
        <div class="result-name" id="resultName">준비됐나요?</div>
        <div class="result-message" id="resultMessage">버튼을 눌러 윷을 던지세요!</div>
        <div class="extra-note" id="extraNote"></div>
      </div>

      <button class="throw-button" id="throwButton" type="button">
        🎲 윷 던지기
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
