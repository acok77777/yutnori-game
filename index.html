
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4df">
  <title>신나는 윷 던지기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>🎲 신나는 윷 던지기</h1>

    <section class="game-card">
      <h2>🪵 윷 던지는 곳</h2>

      <div class="arena" id="arena">
        <div class="shadow"></div>
        <div class="sticks" id="sticks">
          <div class="stick"><span class="dots">●　●　●</span></div>
          <div class="stick"><span class="dots">●　●　●</span></div>
          <div class="stick"><span class="dots">●　●　●</span></div>
          <div class="stick"><span class="dots">●　●　●</span></div>
        </div>
        <div class="ground"></div>
      </div>

      <div class="result" aria-live="polite">
        <div id="emoji">🍀</div>
        <div id="name">준비됐나요?</div>
        <p id="message">버튼을 눌러 윷을 던지세요!</p>
        <p id="extra"></p>
      </div>

      <button id="throwButton">🎲 윷 던지기</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
