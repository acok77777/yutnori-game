
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff4d8">
  <meta name="description" content="신나는 윷던지기! 도 개 걸 윷 모를 확인해 보세요.">

  <title>신나는 윷던지기 🎲</title>

  <!-- 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="신나는 윷던지기">
  <meta property="og:title" content="🎲 신나는 윷던지기">
  <meta property="og:description" content="도·개·걸·윷·모! 오늘의 행운을 던져 봐요!">
  <meta property="og:url" content="https://acok77777.github.io/yutnori-game/">
  <meta property="og:image" content="https://acok77777.github.io/yutnori-game/yut-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div class="brand-mark">🎲</div>
      <h1>신나는 윷던지기</h1>
      <button id="soundToggle" class="icon-button"
        type="button" aria-label="효과음 끄기" aria-pressed="true">🔊</button>
    </header>

    <section class="game-card">

      <div class="arena-heading">
        <h2>🎯 윷 던지는 곳</h2>
        <span id="turnCount" class="turn-counter">0회</span>
      </div>

      <div id="arena" class="arena" aria-label="윷 던지는 공간">
        <div class="arena-spark spark-one">✦</div>
        <div class="arena-spark spark-two">✧</div>

        <div class="sticks" id="sticks">
          <div class="yut-stick face-round" data-stick="0"><span class="stick-mark"></span></div>
          <div class="yut-stick face-round" data-stick="1"><span class="stick-mark"></span></div>
          <div class="yut-stick face-round" data-stick="2"><span class="stick-mark"></span></div>
          <div class="yut-stick face-round" data-stick="3"><span class="stick-mark"></span></div>
        </div>

        <div id="throwHint" class="throw-hint">던질 준비 완료!</div>
      </div>

      <div class="result-panel" id="resultPanel" aria-live="polite" aria-atomic="true">
        <div id="resultEmoji" class="result-emoji">🍀</div>
        <div class="result-copy">
          <p class="result-label">나온 결과</p>
          <h2 id="resultName">윷을 던져 보세요!</h2>
          <p id="resultMessage" class="result-message">도 · 개 · 걸 · 윷 · 모</p>
        </div>
      </div>

      <button id="throwButton" class="throw-button" type="button">
        🎲 윷던지기
      </button>

      <p class="extra-turn-note" id="extraTurnNote">
        윷 또는 모가 나오면 한 번 더!
      </p>
    </section>

    <section class="history-card">
      <div class="history-heading">
        <h2>📋 던지기 기록</h2>
        <button id="resetButton" class="reset-button" type="button">기록 초기화</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty-history">아직 던진 기록이 없어요.</p>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

  </main>
</body>
</html>
